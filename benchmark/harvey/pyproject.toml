[project]
name = "vrag-harvey"
version = "0.1.0"
description = "Verification for RAG on Harvey LAB firm-knowledge: corpus representation, verifiers and arms"
requires-python = ">=3.12,<3.14"
dependencies = ["lab-core", "rank-bm25"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["vharvey*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["harvey-labs", "evo-harness-ref", "runs", "kb", "cache", "_scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
